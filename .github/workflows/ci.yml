name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  setup-fixture:
    name: Installer fixture lifecycle
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test harmless installer fixture
        shell: pwsh
        run: |
          $inputs = Get-Content docs/nsis-inputs.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Path target/tmp/installer-tools | Out-Null
          $archive = Join-Path $PWD 'target/tmp/installer-tools/nsis-3.12.zip'
          curl.exe --fail --location --max-time 45 --output $archive $inputs.archive.url
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed.' }
          [pscustomobject]@{bytes=(Get-Item -LiteralPath $archive).Length;sha256=(Get-FileHash -LiteralPath $archive).Hash} | ConvertTo-Json -Compress
          .\scripts\test-setup-fixture.ps1 -NsisArchive $archive

      - name: Verify portable source companion archives
        shell: pwsh
        run: .\scripts\test-candidate-material-archive.ps1

  rust:
    name: Rust checks
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc

      - name: Prepare pinned FFmpeg development files
        shell: pwsh
        run: .\scripts\setup-ffmpeg.ps1 -ExportGitHubEnvironment

      - name: Generate M1 codec fixtures
        shell: pwsh
        run: .\scripts\generate-m1-fixtures.ps1

      - name: Check formatting
        run: cargo +1.98.0 fmt --all --check

      - name: Run Clippy
        run: cargo +1.98.0 clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo +1.98.0 test --workspace --all-targets

      - name: Verify Rust third-party notices
        shell: pwsh
        run: |
          .\scripts\setup-rust-notices.ps1
          .\scripts\test-rust-notices.ps1

      - name: Verify Rust runtime notices
        shell: pwsh
        run: |
          .\scripts\prepare-rust-runtime-notices.ps1 -Download
          .\scripts\test-rust-runtime-notices.ps1

      - name: Verify pinned MSYS2 bootstrap inputs
        shell: pwsh
        run: |
          .\scripts\get-msys2-bootstrap.ps1 -Download
          .\scripts\test-msys2-bootstrap.ps1

      - name: Verify read-only VC prerequisite policy
        shell: pwsh
        run: .\scripts\test-vc-redist-status.ps1
