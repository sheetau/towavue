name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**/*.md'
      - 'docs/images/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**/*.md'
      - 'docs/images/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  setup-fixture:
    name: Installer fixture lifecycle
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare pinned NSIS
        shell: pwsh
        run: |
          $inputs = Get-Content docs/nsis-inputs.json -Raw -Encoding UTF8 | ConvertFrom-Json
          New-Item -ItemType Directory -Path target/tmp/installer-tools | Out-Null
          $archive = Join-Path $PWD 'target/tmp/installer-tools/nsis-3.12.zip'
          curl.exe --fail --location --max-time 45 --output $archive $inputs.archive.url
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed.' }

      - name: Verify installer lifecycle and fault recovery
        shell: pwsh
        run: .\scripts\test-ci.ps1 -Phase Installer -NsisArchive target/tmp/installer-tools/nsis-3.12.zip

  materials:
    name: Notices and prerequisite policy
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'vendor/png/Cargo.lock') }}
      - name: Verify notices and prerequisite policy
        shell: pwsh
        run: .\scripts\test-ci.ps1 -Phase Materials

  rust:
    name: Rust checks
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc
      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'vendor/png/Cargo.lock') }}
      - name: Identify hosted build image
        id: image
        shell: pwsh
        run: '"version=$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      - name: Cache development build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/ci-cargo
          # Never reuse across native inputs, profile/toolchain or hosted image changes.
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'scripts/setup-ffmpeg.ps1', 'scripts/test-ci.ps1', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'scripts/setup-ffmpeg.ps1', 'scripts/test-ci.ps1', '.github/workflows/ci.yml') }}-
      - name: Verify formatting, vendored renderers, Clippy and workspace tests
        shell: pwsh
        run: .\scripts\test-ci.ps1 -Phase Rust
