name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc

      - name: Check formatting
        run: cargo +1.98.0 fmt --all --check

      - name: Run Clippy
        run: cargo +1.98.0 clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo +1.98.0 test --workspace --all-targets
