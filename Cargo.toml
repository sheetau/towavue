[workspace]
members = [
    "crates/towavue-app",
    "crates/towavue-core",
    "crates/towavue-runtime-windows",
]
resolver = "3"
exclude = ["vendor/egui-directx11", "vendor/png", "vendor/wasapi", "vendor/image-webp"]

[patch.crates-io]
egui-directx11 = { path = "vendor/egui-directx11" }
png = { path = "vendor/png" }
wasapi = { path = "vendor/wasapi" }
image-webp = { path = "vendor/image-webp" }

[workspace.package]
version = "1.0.5"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/sheetau/towavue"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# Keep the baseline target CPU while optimizing across crate boundaries.
[profile.release]
lto = "thin"
codegen-units = 1

# The app's large native test binary exceeds MSVC's PDB limit with full type
# debug data. Keep source locations without affecting ordinary product builds.
[profile.test]
debug = "line-tables-only"
