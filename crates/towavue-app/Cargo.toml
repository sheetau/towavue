[package]
name = "towavue-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
presentation-verification = ["towavue-runtime-windows/presentation-verification", "towavue-runtime-windows/render-verification"]
shell-lifecycle-verification = ["towavue-runtime-windows/shell-lifecycle-verification"]

[[bin]]
name = "towavue"
path = "src/main.rs"

[dependencies]
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
egui = "=0.35.0"
egui-winit = { version = "=0.35.0", default-features = false, features = ["accesskit", "clipboard"] }
towavue-core = { path = "../towavue-core" }
towavue-runtime-windows = { path = "../towavue-runtime-windows" }
winit = "=0.30.13"

[dev-dependencies]
towavue-runtime-windows = { path = "../towavue-runtime-windows", features = ["render-verification"] }

[build-dependencies]
find-msvc-tools = "=0.1.12"

[lints]
workspace = true
