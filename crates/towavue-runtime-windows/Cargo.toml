[package]
name = "towavue-runtime-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
crc32fast = "=1.5.1"
egui = "=0.35.0"
egui-directx11 = "=0.13.0"
ffmpeg-next = { version = "=9.0.0", default-features = false, features = [
    "codec",
    "format",
    "filter",
    "software-resampling",
    "software-scaling",
] }
flate2 = "=1.1.10"
image = { version = "=0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
raw-window-handle = "=0.6.2"
thiserror = "=2.0.20"
towavue-core = { path = "../towavue-core" }
wasapi = "=0.24.0"
winit = "=0.30.13"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
